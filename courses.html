<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Fields - Engineering Guidance</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/header.css" />
  <link rel="stylesheet" href="styles/grid.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <!-- Header include -->


  <!-- Engineering Fields Catalog -->
  <section class="courses-page container">
    <h1>Explore Engineering Fields</h1>
    <p class="page-intro">Discover which engineering discipline matches your interests, skills, and career goals. Each field offers unique opportunities to solve problems and make an impact.</p>
    <div class="filters">
      <div class="filter-group">
        <label for="filter-skill">By Category:</label>
        <select id="filter-skill">
          <option value="all">All</option>
          <option value="mechanical">Mechanical</option>
          <option value="electrical">Electrical</option>
          <option value="software">Software</option>
          <option value="civil">Civil</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-level">By Interest:</label>
        <select id="filter-level">
          <option value="all">All</option>
          <option value="beginner">Problem Solving</option>
          <option value="intermediate">Design & Build</option>
          <option value="advanced">Innovation</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="search-courses">Search:</label>
        <input type="text" id="search-courses" placeholder="Search engineering fields..." />
      </div>
    </div>

    <div class="grid" id="courses-catalog">
      <!-- Course cards injected via courses.js -->
    </div>

    <div class="pagination" id="courses-pagination">
      <button class="page-btn" id="prev-page" disabled>Previous</button>
      <span id="page-info">Page 1 of 1</span>
      <button class="page-btn" id="next-page" disabled>Next</button>
    </div>
  </section>

 

  <script src="scripts/main.js"></script>
  <script src="scripts/menu.js"></script>
  <script src="scripts/courses.js"></script>
</body>
</html>
